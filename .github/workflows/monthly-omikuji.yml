name: Monthly omikuji source check

on:
  schedule:
    # 每月 3 日 09:00 香港時間。GitHub 的排程用 UTC，而且不保證準時。
    - cron: "0 1 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check feeds
        run: python scripts/update_sources.py

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/omikuji.json updates/changelog.json updates/auto-update-log.json
          if git diff --cached --quiet; then
            echo "沒有新資料"
            exit 0
          fi
          git commit -m "自動更新御神籤來源"
          git push
